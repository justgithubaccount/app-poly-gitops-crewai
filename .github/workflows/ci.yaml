name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src --ignore-missing-imports
      - name: Unit tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: uv run pytest
      - name: In-cluster entrypoint test
        run: sh tests/test_container_entrypoint.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app-poly-gitops-crewai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify kubectl client
        run: docker run --rm --entrypoint kubectl app-poly-gitops-crewai:test version --client=true
      - name: Verify API endpoints
        run: |
          set -euo pipefail
          container_id=$(docker run -d -p 8000:8000 app-poly-gitops-crewai:test)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then
              break
            fi
            sleep 2
          done
          test "$(jq -r .status health.json)" = ok
          test "$(curl --fail --silent http://127.0.0.1:8000/flows | jq '.flows | length')" -ge 2
          test "$(curl --fail --silent http://127.0.0.1:8000/agents | jq '.agents | length')" -eq 9
