name: One-off CrewAI lock resolution (feature branch only)
on:
  push:
    branches:
      - fix/crewai-native-openrouter-no-litellm
    paths:
      - .github/workflows/oneoff-crewai-lock.yml
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'justgithubaccount/app-poly-gitops-crewai' && github.ref == 'refs/heads/fix/crewai-native-openrouter-no-litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Resolve new CrewAI dependency graph without installing it
        run: uv lock --upgrade
      - name: Fail closed before dependency installation
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          lock = tomllib.loads(pathlib.Path("uv.lock").read_text())
          packages = {(p["name"], p["version"]) for p in lock["package"]}
          names = {name for name, _ in packages}
          if ("crewai", "1.15.33") not in packages:
              raise SystemExit("expected exact CrewAI version absent from lock")
          if "litellm" in names:
              raise SystemExit("LiteLLM still present in resolved package graph")
          forbidden = {("litellm", v) for v in ("1.82.7", "1.82.8", "1.107.0")}
          if packages & forbidden:
              raise SystemExit("compromised package version present")
          print("Resolved CrewAI 1.15.33 without LiteLLM")
          PY
      - name: Commit lockfile only to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(no-release): regenerate native CrewAI lock"
          git push origin HEAD:fix/crewai-native-openrouter-no-litellm
