k8s_pods_overview:
  description: >
    Call kubectl_tool with action="get", kind="pods".
    Always return ONLY the raw output from kubectl_tool.
    If kubectl_tool returns empty, output must be empty too.
  expected_output: >
    Exact stdout from kubectl_tool (wide format). No fabricated data.
  agent: k8s_operator
  inputs:
    namespace: all

explain_pods:
  description: >
    Take the raw kubectl output from the previous task and explain it in plain language.
    Scope every statement to the requested namespace from the flow context; when the
    namespace is not "all", never present the result as a cluster-wide inventory.
    Summarize pod phases exactly as reported. Completed and Succeeded are successful terminal states,
    not failures. Count a pod as failing only when its observed status is Failed, Error, CrashLoopBackOff,
    ImagePullBackOff, or another explicit failure state in the raw output. Do not infer a failure from
    READY=0/1 for a completed Job. Do not assign an application role that is absent from the pod name,
    labels, or supplied context.
  expected_output: >
    Namespace-scoped, evidence-grounded summary (paragraph + bullet points) with
    successful terminal Jobs separated from active and failing pods.
  agent: reporting_analyst

cluster_summary:
  description: >
    Analyze the raw Kubernetes outputs from the previous tasks and provide a
    high-level summary. Begin the first line with the exact evidence scope from
    the flow context: "Scope: all namespaces" or "Scope: namespace <name>".
    Treat a non-"all" namespace as namespace-scoped evidence, never as a cluster
    inventory. Only report components explicitly present in those
    outputs. Do not infer components from a typical Kubernetes architecture,
    from the task instructions, or from examples such as Argo CD, an ingress
    controller, Vector, Loki, Grafana, or OpenTelemetry. For an expected
    category with no direct evidence, say "not observed in the supplied
    snapshot"; never translate that into "not installed", "not deployed", or
    "absent". Treat tool errors and unavailable metrics as unknown, not as proof
    that a component is installed, absent, healthy, or unhealthy. Preserve the
    pod phase semantics from the preceding explanation: Completed and Succeeded
    Jobs are successful, not failing.
  expected_output: >
    Evidence-grounded explanation of detected components, their observed
    status, and explicit unknowns. No fabricated or assumed components.
  agent: infra_architect

# Argo CD and GitOps
argocd_list_apps:
  description: >
    Use argocd_tool with op="list_apps".
    Return the raw list; if API creds are missing, return the tool error.
  expected_output: >
    "Apps:\n<one-per-line>" or explicit ERROR from tool.
  agent: argocd_observer

argocd_app_status_chat_api:
  description: >
    Use argocd_tool with op="app_status", app="chat-api" (default).
    Report Sync and Health for chat-api Argo application.
  expected_output: >
    Single block: "App: chat-api\nSync: <status>\nHealth: <status>" or explicit ERROR.
  agent: argocd_observer
  inputs:
    app: chat-api

# Mutating; disabled unless ALLOW_MUTATING=true.
argocd_sync_chat_api:
  description: >
    If and only if ALLOW_MUTATING=true, call argocd_tool with op="app_sync", app="chat-api".
    Otherwise, output the tool's safety error verbatim.
  expected_output: >
    "Triggered sync for chat-api" or safety ERROR.
  agent: argocd_observer
  inputs:
    app: chat-api

# Loki and observability
loki_recent_errors_chat_api:
  description: >
    Use loki_query to fetch last 30 minutes for {app="chat-api"} with "|= \"ERROR\"" and limit=200.
    Return tool output verbatim; do NOT invent lines.
  expected_output: >
    "Matches: <n>\nPreview:\n<up to 10 samples>" or explicit ERROR.
  agent: loki_analyst
  inputs:
    query: '{app="chat-api"} |= "ERROR"'
    minutes: 30
    limit: 200

loki_http_activity_chat_api:
  description: >
    Use loki_query to fetch last 30 minutes for {app="chat-api"} and provide a quick activity glimpse.
    Prefer query: '{app="chat-api"} |= "HTTP"' with limit=200.
  expected_output: >
    "Matches: <n>\nPreview:\n<samples>" or explicit ERROR.
  agent: loki_analyst
  inputs:
    query: '{app="chat-api"} |= "HTTP"'
    minutes: 30
    limit: 200

# Kubernetes resource pressure
k8s_top_nodes:
  description: >
    Call kubectl_tool exactly once with action="top", kind="nodes" to fetch
    node-level CPU/MEM usage. Output the tool result verbatim. Do not claim
    that Metrics Server is running or diagnose the error unless the tool output
    explicitly provides that evidence.
  expected_output: >
    Exact stdout from kubectl top nodes.
  agent: k8s_operator

k8s_top_pods_ns_default:
  description: >
    Read the namespace from the flow context and call kubectl_tool exactly once
    with action="top", kind="pods" and that namespace. Use default only when no namespace
    is present in the flow context. Output the tool result verbatim;
    do not rewrite or diagnose it.
  expected_output: >
    Exact stdout from kubectl top pods.
  agent: k8s_operator
  inputs:
    namespace: default

k8s_events_recent:
  description: >
    Use kubectl_tool with action="get", kind="events" and namespace "all" to fetch recent cluster events.
    Output tool result verbatim.
  expected_output: >
    Exact stdout from kubectl get events -A.
  agent: k8s_operator
  inputs:
    namespace: all
    kind: events

# Cloudflare
dns_check_records:
  description: >
    Use cloudflare_dns_tool with op="list" to fetch DNS records for the configured zone.
    Return tool output verbatim; do NOT invent lines.
  expected_output: >
    "Records:\n<type name content proxied ttl>..." or explicit ERROR.
  agent: cloudflare_admin

dns_get_record_api:
  description: >
    Use cloudflare_dns_tool with op="get", name="api" (or FQDN if provided via inputs.fqdn).
    Return the raw record data or "NOT FOUND".
  expected_output: >
    One block with the record info, "NOT FOUND", or ERROR.
  agent: cloudflare_admin
  inputs:
    name: "api"

# Mutating; guarded by ALLOW_MUTATING.
dns_upsert_record_api:
  description: >
    If ALLOW_MUTATING=true, use cloudflare_dns_tool with op="upsert" to ensure an A/AAAA/CNAME for API endpoint.
    Inputs: name, type, content, proxied(bool), ttl.
    Otherwise, output the safety ERROR verbatim.
  expected_output: >
    "UPSERT OK: <id>" or safety ERROR.
  agent: cloudflare_admin

# OpenRouter and LLM gateway
llm_gateway_health:
  description: >
    Use openrouter_health_tool with op="models" to verify gateway and list a short preview.
    Return tool output verbatim.
  expected_output: >
    "Models:<count>\nPreview:\n<up to 10 lines>" or explicit ERROR.
  agent: llm_gateway_observer

# MCP Kubernetes bridge
mcp_k8s_env_check:
  description: >
    Validate env for mcp-server-kubernetes connectivity and produce a client config snippet.
    Use mcp_k8s_tool with op="env_check" then op="config_snippet".
  expected_output: >
    "OK: <details>\nSnippet:\n<json/yaml>" or explicit ERROR with missing keys.
  agent: mcp_bridge

# GitHub incident filing
incident_create_issue_if_needed:
  description: >
    If ALLOW_MUTATING=true and previous steps (Loki/Argo/K8s) indicate problems
    (e.g., Matches>0 with critical errors, Health!=Healthy, Sync!=Synced,
    CrashLoopBackOff), then call github_create_issue to open an issue in repo
    "justgithubaccount/app-release". When mutations are disabled, return the
    tool's safety error instead of attempting issue creation.
    Title format: "[auto] Incident detected: <short reason>".
    Body must include: last 10 error lines from Loki (if any), Argo app status summary, kubectl pod state snippet.
    If no problems detected, output "No incident filed".
  expected_output: >
    "Created issue #<n> in justgithubaccount/app-release", "No incident filed",
    or the mutation safety ERROR.
  agent: incident_triager

